<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎨 Teste de Melhoria de Imagem com IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-12">
            <h1 class="text-5xl font-bold text-white mb-4">
                🎨 Melhoria de Imagem com IA
            </h1>
            <p class="text-gray-300 text-lg">
                Teste o upscaling e enhancement automático do Cloudinary
            </p>
        </div>

        <!-- Upload Area -->
        <div class="bg-white rounded-2xl shadow-2xl p-8 mb-8">
            <div class="border-2 border-dashed border-gray-300 rounded-xl p-12 text-center hover:border-purple-500 transition-colors cursor-pointer"
                id="uploadArea">
                <div class="flex flex-col items-center gap-4">
                    <div class="w-20 h-20 bg-purple-100 rounded-full flex items-center justify-center">
                        <svg class="w-10 h-10 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12">
                            </path>
                        </svg>
                    </div>
                    <div>
                        <p class="text-gray-700 font-semibold text-lg">Clique para fazer upload</p>
                        <p class="text-gray-500 text-sm mt-1">ou arraste e solte aqui</p>
                        <p class="text-gray-400 text-xs mt-2">PNG, JPG ou WEBP (máx. 5MB)</p>
                    </div>
                </div>
                <input type="file" id="fileInput" accept="image/*" class="hidden">
            </div>
        </div>

        <!-- Comparison -->
        <div id="comparison" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
                <!-- Original -->
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
                    <div class="bg-gradient-to-r from-gray-700 to-gray-800 px-6 py-4">
                        <h3 class="text-white font-bold text-lg flex items-center gap-2">
                            📸 Original
                            <span id="originalSize" class="text-sm font-normal text-gray-300"></span>
                        </h3>
                    </div>
                    <div class="p-4">
                        <div class="aspect-square bg-gray-100 rounded-lg overflow-hidden">
                            <img id="originalImage" class="w-full h-full object-cover">
                        </div>
                    </div>
                </div>

                <!-- Enhanced -->
                <div class="bg-white rounded-2xl shadow-xl overflow-hidden border-2 border-purple-500">
                    <div class="bg-gradient-to-r from-purple-600 to-pink-600 px-6 py-4">
                        <h3 class="text-white font-bold text-lg flex items-center gap-2">
                            ✨ Melhorada com IA
                            <span id="processingTime" class="text-sm font-normal text-purple-100"></span>
                        </h3>
                    </div>
                    <div class="p-4">
                        <div class="aspect-square bg-gray-100 rounded-lg overflow-hidden relative">
                            <img id="enhancedImage" class="w-full h-full object-cover hidden">
                            <div id="loading" class="absolute inset-0 flex items-center justify-center">
                                <div class="text-center">
                                    <div
                                        class="animate-spin rounded-full h-16 w-16 border-b-4 border-purple-600 mx-auto mb-4">
                                    </div>
                                    <p class="text-gray-600 font-semibold">Processando com IA...</p>
                                    <p class="text-gray-500 text-sm mt-2">Upscaling 2x + Enhancement</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Info Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                <div class="bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl p-6 text-white">
                    <div class="text-3xl mb-2">🔍</div>
                    <div class="text-2xl font-bold mb-1">2x</div>
                    <div class="text-blue-100 text-sm">Upscaling</div>
                </div>
                <div class="bg-gradient-to-br from-green-500 to-green-600 rounded-xl p-6 text-white">
                    <div class="text-3xl mb-2">🎨</div>
                    <div class="text-2xl font-bold mb-1">Auto</div>
                    <div class="text-green-100 text-sm">Enhancement</div>
                </div>
                <div class="bg-gradient-to-br from-purple-500 to-purple-600 rounded-xl p-6 text-white">
                    <div class="text-3xl mb-2">⚡</div>
                    <div class="text-2xl font-bold mb-1" id="speedDisplay">-</div>
                    <div class="text-purple-100 text-sm">Segundos</div>
                </div>
            </div>

            <!-- Actions -->
            <div class="flex gap-4">
                <button onclick="reset()"
                    class="flex-1 bg-gray-700 hover:bg-gray-600 text-white font-bold py-4 px-6 rounded-xl transition-colors">
                    🔄 Testar Outra Imagem
                </button>
                <button onclick="downloadEnhanced()"
                    class="flex-1 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-700 hover:to-pink-700 text-white font-bold py-4 px-6 rounded-xl transition-all">
                    💾 Baixar Versão Melhorada
                </button>
            </div>
        </div>
    </div>

    <script>
        const CLOUDINARY_CLOUD_NAME = 'dz2egpnu7';
        let enhancedUrl = '';

        document.getElementById('uploadArea').addEventListener('click', () => {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', handleFileSelect);

        async function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            // Validar tamanho
            if (file.size > 5 * 1024 * 1024) {
                alert('Arquivo muito grande! Máximo 5MB');
                return;
            }

            // Mostrar preview original
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('originalImage').src = e.target.result;
                document.getElementById('originalSize').textContent = `(${(file.size / 1024).toFixed(0)} KB)`;
            };
            reader.readAsDataURL(file);

            // Mostrar área de comparação
            document.getElementById('comparison').classList.remove('hidden');
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('enhancedImage').classList.add('hidden');

            // Upload e processar
            const startTime = Date.now();
            await uploadAndEnhance(file, startTime);
        }

        async function uploadAndEnhance(file, startTime) {
            try {
                // Upload para Cloudinary
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', 'ml_default');
                formData.append('folder', 'products');

                const response = await fetch(
                    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
                    {
                        method: 'POST',
                        body: formData
                    }
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error?.message || 'Erro ao fazer upload');
                }

                // Construir URL com transformações de IA
                const originalUrl = data.secure_url;
                enhancedUrl = originalUrl.replace(
                    '/upload/',
                    '/upload/e_upscale,e_enhance,e_auto_color,e_auto_contrast,q_auto:best,f_auto/'
                );

                // Mostrar imagem melhorada
                const img = document.getElementById('enhancedImage');
                img.onload = () => {
                    const processingTime = ((Date.now() - startTime) / 1000).toFixed(2);
                    document.getElementById('loading').classList.add('hidden');
                    img.classList.remove('hidden');
                    document.getElementById('processingTime').textContent = `(${processingTime}s)`;
                    document.getElementById('speedDisplay').textContent = processingTime;
                };
                img.src = enhancedUrl;

            } catch (error) {
                console.error('Erro:', error);
                alert('Erro ao processar imagem: ' + error.message);
                reset();
            }
        }

        function reset() {
            document.getElementById('comparison').classList.add('hidden');
            document.getElementById('fileInput').value = '';
            enhancedUrl = '';
        }

        function downloadEnhanced() {
            if (!enhancedUrl) return;
            window.open(enhancedUrl, '_blank');
        }
    </script>
</body>

</html>
